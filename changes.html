<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharmingAPP — 设备改造记录</title>
<style>
:root{
  --bg:#0a0e17; --card:#151c2c; --card2:#1a2233; --border:#252f45;
  --text:#e8ecf2; --dim:#7b8aa3; --accent:#00e676; --cyan:#4fc3f7;
  --orange:#ffb74d; --red:#ff5252; --purple:#b388ff;
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  line-height:1.6;
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,230,118,.08),transparent);
}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

header{padding:48px 0 32px;text-align:center}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
h1 .accent{color:var(--accent)}
.desc{color:var(--dim);font-size:14px;margin-top:10px}
.credit{
  display:inline-block;margin-top:16px;padding:5px 14px;
  border:1px solid rgba(0,230,118,.3);border-radius:16px;
  font-size:11px;color:var(--accent);font-family:var(--mono);
  background:rgba(0,230,118,.05);
}

/* 设备切换 */
.device-tabs{display:flex;gap:12px;justify-content:center;margin:32px 0;flex-wrap:wrap}
.device-tab{
  padding:14px 28px;border-radius:14px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;
  font-size:14px;font-weight:700;transition:.2s;font-family:inherit;
}
.device-tab:hover{border-color:var(--accent)}
.device-tab.on{background:var(--accent);color:#0a0e17;border-color:var(--accent)}
.device-tab .sub{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px}

/* 设备信息卡 */
.device-info{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:24px;margin-bottom:24px;
}
.device-info h2{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.badge{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--dim);font-weight:400}
.badge.ok{color:var(--accent);border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.06)}
.badge.warn{color:var(--orange);border-color:rgba(255,183,77,.3);background:rgba(255,183,77,.06)}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.info-item{background:var(--card2);border-radius:10px;padding:12px 14px}
.info-item .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.info-item .v{font-family:var(--mono);font-size:13px;margin-top:4px;word-break:break-all}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:28px;font-weight:700;line-height:1.2}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}

/* 分类区 */
.section{margin:32px 0}
.section h3{
  font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:10px;
  padding-bottom:10px;border-bottom:1px solid var(--border);
}
.section h3 .icon{font-size:20px}

/* 应用卡片网格 */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.app-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;transition:.15s;display:flex;align-items:center;gap:10px;
}
.app-card:hover{border-color:rgba(0,230,118,.4)}
.app-card .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.app-card .dot.red{background:var(--red)}
.app-card .dot.green{background:var(--accent)}
.app-card .dot.orange{background:var(--orange)}
.app-card .dot.cyan{background:var(--cyan)}
.app-card .body{flex:1;min-width:0}
.app-card .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-card .pkg{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 分类标签 */
.cat-tag{
  font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:5px;
  background:var(--card2);color:var(--dim);white-space:nowrap;flex-shrink:0;
}

/* 空状态 */
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px}

/* 时间线 */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 20px 0}
.tl-item::before{
  content:'';position:absolute;left:-24px;top:5px;width:12px;height:12px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg);
}
.tl-time{font-family:var(--mono);font-size:11px;color:var(--dim)}
.tl-title{font-size:14px;font-weight:600;margin-top:3px}
.tl-desc{font-size:12px;color:var(--dim);margin-top:3px}

footer{margin-top:60px;padding:36px 0;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
footer .credit-line{font-family:var(--mono);color:var(--accent);margin-top:8px}
footer a{color:var(--cyan);text-decoration:none}

.hidden{display:none}
</style>

var current = 'xfold5';

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderAppList(list, dotColor, showCat){
  if (!list || !list.length) return '<div class="empty">无</div>';
  var h = '<div class="app-grid">';
  for (var i = 0; i < list.length; i++){
    var a = list[i];
    h += '<div class="app-card">';
    h += '<div class="dot ' + dotColor + '"></div>';
    h += '<div class="body">';
    h += '<div class="name">' + esc(a.name) + '</div>';
    h += '<div class="pkg">' + esc(a.pkg) + '</div>';
    h += '</div>';
    if (showCat && a.cat) h += '<span class="cat-tag">' + esc(a.cat) + '</span>';
    if (a.reason) h += '<span class="cat-tag">' + esc(a.reason) + '</span>';
    if (a.status === 'failed') h += '<span class="cat-tag" style="color:var(--red)">闪退</span>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

  if (d.rootMethod) h += '<div class="info-item"><div class="k">Root 方式</div><div class="v">' + esc(d.rootMethod) + '</div></div>';

  h += '</div></div>';

  // 统计
  var disCount = d.disabled ? d.disabled.length : 0;
  var delCount = d.deleted ? d.deleted.length : 0;
  var keepCount = d.kept ? d.kept.length : 0;
  var portCount = d.ported ? d.ported.length : 0;
  h += '<div class="stats">';
  h += '<div class="stat"><b style="color:var(--red)">' + disCount + '</b><span>已禁用</span></div>';
  if (delCount) h += '<div class="stat"><b style="color:var(--orange)">' + delCount + '</b><span>已删除</span></div>';
  h += '<div class="stat"><b style="color:var(--accent)">' + keepCount + '</b><span>已保留</span></div>';
  h += '<div class="stat"><b style="color:var(--cyan)">' + portCount + '</b><span>移植应用</span></div>';
  h += '</div>';

  // 已禁用
  if (d.disabled && d.disabled.length){
    h += '<div class="section"><h3><span class="icon">🚫</span>已禁用应用（' + d.disabled.length + '）</h3>';
    h += renderAppList(d.disabled, 'red', true);
    h += '</div>';
  }

  // 已删除
  if (d.deleted && d.deleted.length){
    h += '<div class="section"><h3><span class="icon">🗑️</span>已删除应用（' + d.deleted.length + '）</h3>';
    h += renderAppList(d.deleted, 'orange', false);
    h += '</div>';
  }

  // 后台限制
  if (d.backgroundLimited && d.backgroundLimited.length){
    h += '<div class="section"><h3><span class="icon">⚡</span>后台限制（' + d.backgroundLimited.length + '）</h3>';
    h += '<div class="app-grid">';
    for (var b = 0; b < d.backgroundLimited.length; b++){
      var bl = d.backgroundLimited[b];
      h += '<div class="app-card"><div class="dot orange"></div><div class="body">';
      h += '<div class="name">' + esc(bl.name) + '</div>';
      h += '<div class="pkg">' + esc(bl.pkg) + '</div>';
      h += '</div></div>';
    }
    h += '</div></div>';
  }

  // 已保留
  if (d.kept && d.kept.length){
    h += '<div class="section"><h3><span class="icon">✅</span>已保留应用（' + d.kept.length + '）</h3>';
    h += renderAppList(d.kept, 'green', false);
    h += '</div>';
  }

  // 移植应用
  if (d.ported && d.ported.length){
    h += '<div class="section"><h3><span class="icon">📦</span>移植应用（' + d.ported.length + '）</h3>';
    h += renderAppList(d.ported, 'cyan', false);
    h += '</div>';
  }

  document.getElementById('content').innerHTML = h;
}

var tabs = document.querySelectorAll('.device-tab');
for (var t = 0; t < tabs.length; t++){
  tabs[t].onclick = function(){
    for (var x = 0; x < tabs.length; x++) tabs[x].classList.remove('on');
    this.classList.add('on');
    current = this.getAttribute('data-dev');
    render();
  };
}

render();
</script>
</body>
</html>
